<!DOCTYPE html>
<html lang="es" data-theme="default">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Biblioteca de Álbumes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&family=Bebas+Neue&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>

/* ─── THEME DEFINITIONS ─────────────────────────────────────────── */

[data-theme="default"] {
  --bg: #f7f6f2; --surface: #ffffff; --surface2: #f0ede6; --surface3: #e8e4db;
  --border: rgba(0,0,0,0.09); --border2: rgba(0,0,0,0.16);
  --text: #1c1c1a; --text2: #6b6860; --text3: #aaa49c;
  --accent: #d4410a; --accent-bg: #fff1ec; --accent-text: #b33200;
  --star: #e8a020; --radius: 10px; --radius-lg: 14px; --radius-card: 14px;
  --font-body: 'DM Sans', sans-serif; --font-title: 'DM Sans', sans-serif; --font-mono: monospace;
  --header-bg: #ffffff; --header-border: rgba(0,0,0,0.09);
  --card-hover-transform: translateY(-2px);
  --tag-radius: 20px; --btn-radius: 10px;
  --progress-bg: #e8e4db; --shadow: none;
}

[data-theme="winamp"] {
  --bg: #1a1a1a; --surface: #232323; --surface2: #2d2d2d; --surface3: #383838;
  --border: rgba(0,200,0,0.2); --border2: rgba(0,200,0,0.4);
  --text: #00cc00; --text2: #008800; --text3: #005500;
  --accent: #00ff00; --accent-bg: #003300; --accent-text: #00ff00;
  --star: #00ff00; --radius: 2px; --radius-lg: 2px; --radius-card: 2px;
  --font-body: 'Space Mono', monospace; --font-title: 'Space Mono', monospace; --font-mono: 'Space Mono', monospace;
  --header-bg: #111; --header-border: rgba(0,200,0,0.3);
  --card-hover-transform: none;
  --tag-radius: 2px; --btn-radius: 2px;
  --progress-bg: #003300; --shadow: 0 0 8px rgba(0,255,0,0.15);
}

[data-theme="vinyl"] {
  --bg: #1a1208; --surface: #231a0a; --surface2: #2e2110; --surface3: #3a2a15;
  --border: rgba(212,165,90,0.2); --border2: rgba(212,165,90,0.38);
  --text: #f2dfa8; --text2: #b89a5a; --text3: #7a6030;
  --accent: #e8a020; --accent-bg: #2a1e05; --accent-text: #f2c060;
  --star: #e8a020; --radius: 6px; --radius-lg: 8px; --radius-card: 8px;
  --font-body: 'Courier Prime', monospace; --font-title: 'Playfair Display', serif; --font-mono: 'Courier Prime', monospace;
  --header-bg: #140e04; --header-border: rgba(212,165,90,0.2);
  --card-hover-transform: translateY(-1px);
  --tag-radius: 4px; --btn-radius: 4px;
  --progress-bg: #2e2110; --shadow: none;
}

[data-theme="neon"] {
  --bg: #07000f; --surface: #0e0020; --surface2: #160030; --surface3: #1e0040;
  --border: rgba(180,0,255,0.2); --border2: rgba(180,0,255,0.45);
  --text: #f0d0ff; --text2: #b080d0; --text3: #7040a0;
  --accent: #cc00ff; --accent-bg: #1e0040; --accent-text: #e080ff;
  --star: #ff00aa; --radius: 6px; --radius-lg: 8px; --radius-card: 8px;
  --font-body: 'Syne', sans-serif; --font-title: 'Syne', sans-serif; --font-mono: monospace;
  --header-bg: #07000f; --header-border: rgba(180,0,255,0.25);
  --card-hover-transform: translateY(-2px);
  --tag-radius: 4px; --btn-radius: 6px;
  --progress-bg: #1e0040; --shadow: 0 0 12px rgba(180,0,255,0.2);
  --neon-glow: 0 0 6px rgba(180,0,255,0.5);
}

[data-theme="paper"] {
  --bg: #faf7f0; --surface: #fdf9f2; --surface2: #f3ede0; --surface3: #e8dfc8;
  --border: rgba(100,75,40,0.14); --border2: rgba(100,75,40,0.25);
  --text: #2c2418; --text2: #7a6648; --text3: #b8a880;
  --accent: #7a3a1a; --accent-bg: #f5ece0; --accent-text: #5a2a0a;
  --star: #c0781a; --radius: 3px; --radius-lg: 4px; --radius-card: 3px;
  --font-body: 'Playfair Display', serif; --font-title: 'Playfair Display', serif; --font-mono: 'Courier Prime', monospace;
  --header-bg: #fdf9f2; --header-border: rgba(100,75,40,0.14);
  --card-hover-transform: translateY(-1px);
  --tag-radius: 3px; --btn-radius: 3px;
  --progress-bg: #f3ede0; --shadow: none;
}

[data-theme="brutalist"] {
  --bg: #f0f0f0; --surface: #ffffff; --surface2: #e0e0e0; --surface3: #cccccc;
  --border: rgba(0,0,0,1); --border2: rgba(0,0,0,1);
  --text: #000000; --text2: #333333; --text3: #666666;
  --accent: #ff3300; --accent-bg: #ffeecc; --accent-text: #cc2200;
  --star: #ff3300; --radius: 0px; --radius-lg: 0px; --radius-card: 0px;
  --font-body: 'Bebas Neue', 'Arial Black', sans-serif; --font-title: 'Bebas Neue', 'Arial Black', sans-serif; --font-mono: monospace;
  --header-bg: #000000; --header-border: #000000;
  --card-hover-transform: translate(2px, -2px);
  --tag-radius: 0px; --btn-radius: 0px;
  --progress-bg: #e0e0e0; --shadow: none;
}

/* ─── BASE STYLES ───────────────────────────────────────────────── */
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  transition: background .3s, color .3s;
}

/* WINAMP scanline overlay */
[data-theme="winamp"] body::after,
[data-theme="neon"] body::after {
  content: '';
  position: fixed; inset: 0; pointer-events: none; z-index: 9999;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
}

/* ─── HEADER ─────────────────────────────────────────────────────── */
header {
  background: var(--header-bg);
  border-bottom: 1px solid var(--header-border);
  padding: 0.75rem 1.5rem;
  display: flex; align-items: center; gap: 14px;
  position: sticky; top: 0; z-index: 50;
}
[data-theme="brutalist"] header { border-bottom: 3px solid #000; }
[data-theme="winamp"] header { border-bottom: 1px solid var(--border2); }

.header-left { flex: 1; }
.header-title {
  font-family: var(--font-title);
  font-size: 18px; font-weight: 700; letter-spacing: -0.3px;
}
[data-theme="winamp"] .header-title { color: #00ff00; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; }
[data-theme="vinyl"] .header-title { font-size: 20px; letter-spacing: 0.5px; }
[data-theme="neon"] .header-title { color: #cc00ff; text-shadow: 0 0 10px rgba(200,0,255,0.7); letter-spacing: 1px; }
[data-theme="paper"] .header-title { font-style: italic; }
[data-theme="brutalist"] .header-title { font-size: 24px; color: #ffffff; letter-spacing: 2px; text-transform: uppercase; }

.header-sub { font-size: 11px; color: var(--text2); margin-top: 1px; font-family: var(--font-mono); }

/* Theme switcher */
.theme-switcher { display: flex; gap: 5px; align-items: center; }
.theme-dot {
  width: 22px; height: 22px; border-radius: 50%; cursor: pointer;
  border: 2px solid transparent; transition: border-color .15s, transform .15s;
  position: relative; overflow: hidden; flex-shrink: 0;
}
.theme-dot:hover { transform: scale(1.15); }
.theme-dot.active { border-color: var(--accent); }
.theme-dot[data-t="default"]  { background: linear-gradient(135deg,#f7f6f2 50%,#d4410a 50%); }
.theme-dot[data-t="winamp"]   { background: linear-gradient(135deg,#1a1a1a 50%,#00ff00 50%); }
.theme-dot[data-t="vinyl"]    { background: linear-gradient(135deg,#1a1208 50%,#e8a020 50%); }
.theme-dot[data-t="neon"]     { background: linear-gradient(135deg,#07000f 50%,#cc00ff 50%); }
.theme-dot[data-t="paper"]    { background: linear-gradient(135deg,#faf7f0 50%,#7a3a1a 50%); }
.theme-dot[data-t="brutalist"]{ background: linear-gradient(135deg,#ffffff 50%,#ff3300 50%); border: 2px solid #000; }

/* ─── MAIN ──────────────────────────────────────────────────────── */
.main { max-width: 1200px; margin: 0 auto; padding: 1.25rem 1.25rem 3rem; }

/* ─── TOOLBAR ───────────────────────────────────────────────────── */
.toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 0.75rem; }
.toolbar input[type=text] {
  flex: 1; min-width: 200px; padding: 8px 12px;
  border: 1px solid var(--border2); border-radius: var(--radius);
  background: var(--surface); color: var(--text);
  font-size: 13px; font-family: var(--font-body); outline: none;
  transition: border-color .15s;
}
.toolbar input[type=text]:focus { border-color: var(--accent); }
[data-theme="winamp"] .toolbar input[type=text] { background: #111; border-color: var(--border2); }
[data-theme="neon"] .toolbar input[type=text] { background: #0e0020; }

select {
  padding: 8px 10px; border: 1px solid var(--border2); border-radius: var(--radius);
  background: var(--surface); color: var(--text); font-size: 12px;
  cursor: pointer; outline: none; font-family: var(--font-body);
}

.view-btns { display: flex; gap: 4px; }
.view-btn {
  background: transparent; border: 1px solid var(--border2);
  border-radius: var(--btn-radius); padding: 7px 11px;
  cursor: pointer; font-size: 12px; color: var(--text2);
  font-family: var(--font-body); transition: all .15s;
}
.view-btn.active { background: var(--surface2); color: var(--text); }
[data-theme="brutalist"] .view-btn.active { background: #000; color: #fff; }

.btn {
  padding: 7px 14px; border: 1px solid transparent;
  border-radius: var(--btn-radius); font-size: 12px; font-weight: 500;
  cursor: pointer; font-family: var(--font-body); transition: opacity .15s;
  white-space: nowrap;
}
.btn:hover { opacity: 0.82; }
.btn-primary { background: var(--accent); color: #fff; }
[data-theme="winamp"] .btn-primary { color: #000; font-weight: 700; }
[data-theme="brutalist"] .btn-primary { border: 2px solid #000; font-size: 13px; letter-spacing: 1px; }
.btn-danger { background: transparent; color: var(--accent); border-color: var(--accent); }
.btn-secondary {
  background: var(--surface2); color: var(--text);
  border-color: var(--border2);
}
[data-theme="brutalist"] .btn-secondary { border: 2px solid #000; }
.count { font-size: 11px; color: var(--text2); white-space: nowrap; margin-left: auto; font-family: var(--font-mono); }

/* ─── IO BAR ─────────────────────────────────────────────────────── */
.io-bar { display: flex; gap: 8px; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }
.cache-info { font-size: 11px; color: var(--text3); font-family: var(--font-mono); }

/* ─── TAG FILTER ────────────────────────────────────────────────── */
.tag-filter { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1rem; }
.tag-pill {
  font-size: 11px; padding: 4px 10px;
  border-radius: var(--tag-radius); border: 1px solid var(--border2);
  cursor: pointer; color: var(--text2); background: transparent;
  font-family: var(--font-body); transition: all .15s;
}
.tag-pill:hover { border-color: var(--accent); color: var(--accent); }
.tag-pill.active { background: var(--accent-bg); color: var(--accent-text); border-color: var(--accent); font-weight: 500; }
[data-theme="brutalist"] .tag-pill { border: 2px solid #000; font-size: 12px; letter-spacing: 0.5px; }
[data-theme="brutalist"] .tag-pill.active { background: #000; color: #fff; border-color: #000; }

/* ─── PROGRESS ──────────────────────────────────────────────────── */
.progress-wrap { margin-bottom: 1rem; }
.progress-label { font-size: 11px; color: var(--text2); margin-bottom: 5px; font-family: var(--font-mono); }
.progress-bar { height: 3px; background: var(--progress-bg); border-radius: 2px; overflow: hidden; }
[data-theme="brutalist"] .progress-bar { height: 6px; border-radius: 0; border: 2px solid #000; }
.progress-fill { height: 100%; background: var(--accent); transition: width .4s; }
[data-theme="winamp"] .progress-fill { box-shadow: 0 0 6px rgba(0,255,0,0.5); }
[data-theme="neon"] .progress-fill { box-shadow: 0 0 6px rgba(200,0,255,0.5); }

/* ─── GRID ───────────────────────────────────────────────────────── */
.grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(152px, 1fr)); gap: 14px; }
.album-card-grid {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  overflow: hidden; cursor: pointer;
  box-shadow: var(--shadow);
  transition: border-color .15s, transform .15s, box-shadow .15s;
}
.album-card-grid:hover { border-color: var(--border2); transform: var(--card-hover-transform); box-shadow: var(--shadow); }
[data-theme="winamp"] .album-card-grid:hover { border-color: var(--accent); box-shadow: 0 0 8px rgba(0,255,0,0.2); }
[data-theme="neon"] .album-card-grid:hover { border-color: var(--accent); box-shadow: 0 0 12px rgba(180,0,255,0.3); }
[data-theme="brutalist"] .album-card-grid { border: 3px solid #000; }
[data-theme="brutalist"] .album-card-grid:hover { transform: translate(3px,-3px); box-shadow: -3px 3px 0 #000; }

.cover {
  width: 100%; aspect-ratio: 1;
  display: flex; align-items: center; justify-content: center;
  font-size: 36px; background: var(--surface2); overflow: hidden;
}
.cover img { width: 100%; height: 100%; object-fit: cover; display: block; }

.grid-info { padding: 9px 10px 11px; }
.grid-title {
  font-size: 12px; font-weight: 600;
  font-family: var(--font-title);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
[data-theme="brutalist"] .grid-title { font-size: 14px; letter-spacing: 0.5px; text-transform: uppercase; }
[data-theme="vinyl"] .grid-title { font-size: 13px; }
.grid-artist {
  font-size: 11px; color: var(--text2);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px;
}

/* ─── STARS ──────────────────────────────────────────────────────── */
.stars { display: flex; gap: 2px; margin-top: 6px; }
.star { width: 11px; height: 11px; clip-path: polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%); }
.star.on { background: var(--star); }
.star.off { background: var(--border2); }
[data-theme="winamp"] .star.on { box-shadow: 0 0 3px rgba(0,255,0,0.6); }

/* ─── TAGS MINI ──────────────────────────────────────────────────── */
.tags-mini { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 6px; }
.tag-mini {
  font-size: 10px; padding: 2px 6px;
  border-radius: var(--tag-radius);
  background: var(--surface2); color: var(--text2);
  font-family: var(--font-body);
}
[data-theme="brutalist"] .tag-mini { border: 1px solid #000; font-size: 9px; letter-spacing: 0.5px; text-transform: uppercase; }
[data-theme="winamp"] .tag-mini { border: 1px solid var(--border); font-size: 9px; }

/* ─── LIST ───────────────────────────────────────────────────────── */
.list-view { display: flex; flex-direction: column; gap: 6px; }
.album-card-list {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  padding: 10px 14px;
  display: flex; align-items: center; gap: 14px;
  cursor: pointer; transition: border-color .15s;
  box-shadow: var(--shadow);
}
.album-card-list:hover { border-color: var(--border2); }
[data-theme="winamp"] .album-card-list:hover { border-color: var(--accent); }
[data-theme="neon"] .album-card-list:hover { border-color: var(--accent); }
[data-theme="brutalist"] .album-card-list { border: 3px solid #000; border-radius: 0; }
[data-theme="brutalist"] .album-card-list:hover { background: #f0f0f0; }

.cover-sm {
  width: 48px; height: 48px;
  border-radius: calc(var(--radius-card) - 2px);
  overflow: hidden; display: flex; align-items: center;
  justify-content: center; font-size: 20px;
  flex-shrink: 0; background: var(--surface2);
}
.cover-sm img { width: 100%; height: 100%; object-fit: cover; display: block; }
.list-info { flex: 1; min-width: 0; }
.list-title {
  font-size: 13px; font-weight: 600; font-family: var(--font-title);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
[data-theme="brutalist"] .list-title { font-size: 16px; letter-spacing: 1px; text-transform: uppercase; }
.list-sub { font-size: 11px; color: var(--text2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--font-mono); }
.list-tags { display: flex; gap: 4px; margin-top: 5px; flex-wrap: wrap; }
.list-right { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; flex-shrink: 0; }
.stars-sm { display: flex; gap: 1px; }
.star-sm { width: 10px; height: 10px; clip-path: polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%); }
.star-sm.on { background: var(--star); } .star-sm.off { background: var(--border2); }
.year-badge { font-size: 11px; color: var(--text3); font-family: var(--font-mono); }

/* ─── PAGINATION ─────────────────────────────────────────────────── */
.pagination { display: flex; align-items: center; gap: 6px; justify-content: center; padding: 1.5rem 0 0.5rem; flex-wrap: wrap; }
.page-btn {
  background: var(--surface); border: 1px solid var(--border2);
  border-radius: var(--btn-radius); padding: 5px 12px;
  cursor: pointer; font-size: 11px; color: var(--text2);
  font-family: var(--font-body); transition: all .15s;
}
.page-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.page-btn:disabled { opacity: 0.3; cursor: default; }
.page-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
[data-theme="winamp"] .page-btn.active { color: #000; }
[data-theme="brutalist"] .page-btn { border: 2px solid #000; border-radius: 0; font-size: 13px; letter-spacing: 1px; }
[data-theme="brutalist"] .page-btn.active { background: #000; color: #fff; }
.sep { color: var(--text3); font-size: 12px; }

/* ─── MODAL ──────────────────────────────────────────────────────── */
.modal-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5);
  display: flex; align-items: center; justify-content: center;
  z-index: 100; padding: 1rem;
}
.modal {
  background: var(--surface);
  border-radius: var(--radius-card);
  border: 1px solid var(--border2);
  width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto;
}
[data-theme="brutalist"] .modal { border: 3px solid #000; border-radius: 0; }
[data-theme="winamp"] .modal { border: 1px solid var(--border2); box-shadow: 0 0 20px rgba(0,200,0,0.15); }
[data-theme="neon"] .modal { border-color: var(--accent); box-shadow: 0 0 20px rgba(180,0,255,0.2); }

.modal-header { display: flex; align-items: center; gap: 14px; padding: 1.1rem 1.25rem 0.75rem; }
.modal-art {
  width: 60px; height: 60px;
  border-radius: calc(var(--radius-card) - 2px);
  overflow: hidden; flex-shrink: 0;
  background: var(--surface2);
  display: flex; align-items: center; justify-content: center; font-size: 24px;
}
.modal-art img { width: 100%; height: 100%; object-fit: cover; }
.modal-header-info { flex: 1; min-width: 0; }
.modal-header-info h2 {
  font-size: 15px; font-weight: 600; font-family: var(--font-title);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
[data-theme="brutalist"] .modal-header-info h2 { font-size: 18px; letter-spacing: 1px; text-transform: uppercase; }
.modal-header-info p { font-size: 11px; color: var(--text2); margin-top: 2px; font-family: var(--font-mono); }
.close-btn {
  background: transparent; border: none; font-size: 18px;
  cursor: pointer; color: var(--text2); flex-shrink: 0;
  padding: 4px 6px; border-radius: 4px; font-family: var(--font-mono);
}
.close-btn:hover { background: var(--surface2); }

.modal-body { padding: 0 1.25rem 1.25rem; }
.field { margin-bottom: 12px; }
.field label {
  display: block; font-size: 10px; font-weight: 600;
  color: var(--text2); text-transform: uppercase; letter-spacing: 0.8px;
  margin-bottom: 5px; font-family: var(--font-mono);
}
[data-theme="brutalist"] .field label { font-size: 11px; letter-spacing: 2px; color: #000; }
.field input, .field select, .field textarea {
  width: 100%; padding: 8px 10px;
  border: 1px solid var(--border2); border-radius: var(--radius);
  background: var(--surface); color: var(--text);
  font-size: 13px; outline: none; font-family: var(--font-body);
  transition: border-color .15s;
}
[data-theme="brutalist"] .field input, [data-theme="brutalist"] .field textarea { border: 2px solid #000; border-radius: 0; font-size: 14px; }
.field input:focus, .field textarea:focus { border-color: var(--accent); }
.field textarea { height: 65px; resize: vertical; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.star-select { display: flex; gap: 8px; padding: 4px 0; }
.star-sel {
  width: 22px; height: 22px; cursor: pointer;
  clip-path: polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
  transition: background .1s;

// ─── COVERS ──────────────────────────────────────────────────────────
async function urlToBase64(url) {
  try {
    const r = await fetch(url);
    const b = await r.blob();
    return await new Promise(res => { const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.readAsDataURL(b); });
  } catch(e){ return null; }
}
async function fetchCoverForAlbum(a) {
  const key = a.title+'|'+a.artist;
  if (covers[key] !== undefined) return covers[key];
  try {
    const q = encodeURIComponent(a.artist+' '+a.title);
    const d = await (await fetch(`https://itunes.apple.com/search?term=${q}&entity=album&limit=3`)).json();
    if (d.results&&d.results.length>0) {
      const b64 = await urlToBase64(d.results[0].artworkUrl100.replace('100x100bb','300x300bb'));
      covers[key] = b64||null; if(b64) saveCoverEntry(key,b64); return b64;
    }
  } catch(e){}
  covers[key]=null; saveCoverEntry(key,null); return null;
}
function getCover(a) { return covers[a.title+'|'+a.artist]||null; }

async function loadAllCovers() {
  const missing = albums.filter(a=>covers[a.title+'|'+a.artist]===undefined);
  if (!missing.length) { document.getElementById('progress-wrap').style.display='none'; updateCacheInfo(); render(); return; }
  loadedCount = 0;
  const total = missing.length;
  document.getElementById('prog-label').textContent = `Cargando portadas… 0 / ${total}`;
  const B = 5;
  for (let i=0;i<missing.length;i+=B) {
    await Promise.all(missing.slice(i,i+B).map(async a=>{
      await fetchCoverForAlbum(a);
      loadedCount++;
      const p = Math.round(loadedCount/total*100);
      document.getElementById('prog-fill').style.width = p+'%';
      document.getElementById('prog-label').textContent = `Cargando portadas… ${loadedCount} / ${total}`;
      if (loadedCount%B===0||loadedCount===total) render();
    }));
  }
  document.getElementById('progress-wrap').style.display = 'none';
  updateCacheInfo();
}
function clearCovers() {
  if (!confirm('¿Volver a descargar todas las portadas? Tardará unos minutos.')) return;
  localStorage.removeItem(COVERS_KEY); covers={};
  document.getElementById('progress-wrap').style.display='block'; loadAllCovers();
}
function updateCacheInfo() {
  const found = albums.filter(a=>covers[a.title+'|'+a.artist]).length;
  document.getElementById('cache-info').textContent = `${found}/${albums.length} portadas`;
  document.getElementById('header-sub').textContent = `${albums.length} álbumes · ${found} portadas`;
}

  return `border-color:${d?c.dtext:c.text};color:${d?c.dtext:c.text};`;
}
function tagMiniStyle(t) {
  const c = TAG_COLORS[t]; if (!c) return '';
  const d = isDark();
  return `background:${d?c.dbg:c.bg};color:${d?c.dtext:c.text};`;
}

// ─── RENDER ───────────────────────────────────────────────────────────
function starsHTML(n, cls='star', total=5) {
  return Array.from({length:total},(_,i)=>`<div class="${cls} ${i<n?'on':'off'}"></div>`).join('');
}
function coverImgOrEmoji(a) {
  const src = a.manualCover || getCover(a);
  return src ? `<img src="${src}" alt="" loading="lazy">` : (a.emoji||'🎵');
}

function renderTagFilter() {
  const used = [...new Set(albums.flatMap(a=>a.tags))];
  const status = STATUS_TAGS.filter(t=>used.includes(t));
  const rest   = used.filter(t=>!STATUS_TAGS.includes(t)).sort();
  document.getElementById('tag-filter').innerHTML = [...status,...rest].map(t => {
    const isActive = activeTags.includes(t);
    return `<button class="tag-pill${isActive?' active':''}" style="${tagStyle(t,isActive)}" onclick="toggleTag('${t.replace(/'/g,"\\'")}'">${t}</button>`;
  }).join('');
}

function toggleTag(t) { activeTags = activeTags.includes(t) ? activeTags.filter(x=>x!==t) : [...activeTags,t]; page=1; render(); }
function setView(v) { view=v; document.getElementById('btn-grid').classList.toggle('active',v==='grid'); document.getElementById('btn-list').classList.toggle('active',v==='list'); render(); }

function getFiltered() {
  const q = document.getElementById('search').value.toLowerCase();
  const s = document.getElementById('sort').value;
  let list = albums.filter(a => {
    const m = !q||(a.title+a.artist+(a.genre||'')).toLowerCase().includes(q);
    const tg = activeTags.length===0||activeTags.every(t=>a.tags.includes(t));
    return m&&tg;
  });
  list.sort((a,b) => {
    if(s==='title') return a.title.localeCompare(b.title);
    if(s==='artist') return a.artist.localeCompare(b.artist);
    if(s==='year') return b.year-a.year;
    if(s==='rating') return b.rating-a.rating;
  });
  return list;
}

function render() {
  renderTagFilter();
  const all = getFiltered(), total = all.length;
  const pages = Math.ceil(total/PER_PAGE)||1;
  if (page>pages) page=1;
  const list = all.slice((page-1)*PER_PAGE, page*PER_PAGE);
  document.getElementById('count').textContent = `${total} álbum${total!==1?'es':''}`;
  const c = document.getElementById('container');
  if (!list.length) { c.innerHTML=`<div class="empty">No se encontraron álbumes.</div>`; document.getElementById('pagination').innerHTML=''; return; }

  if (view==='grid') {
    c.className='grid-view';
    c.innerHTML = list.map(a=>`
      <div class="album-card-grid" onclick="openEdit(${a.id})">
        <div class="cover">${coverImgOrEmoji(a)}</div>
        <div class="grid-info">
          <div class="grid-title">${esc(a.title)}</div>
          <div class="grid-artist">${esc(a.artist)} · ${a.year}</div>
          <div class="stars">${starsHTML(a.rating)}</div>
          <div class="tags-mini">${a.tags.filter(t=>t!=='Spotify Import').slice(0,3).map(t=>`<span class="tag-mini" style="${tagMiniStyle(t)}">${esc(t)}</span>`).join('')}</div>
        </div>
      </div>`).join('');
  } else {
    c.className='list-view';
    c.innerHTML = list.map(a=>`
      <div class="album-card-list" onclick="openEdit(${a.id})">
        <div class="cover-sm">${coverImgOrEmoji(a)}</div>
        <div class="list-info">
          <div class="list-title">${esc(a.title)}</div>
          <div class="list-sub">${esc(a.artist)} · ${a.year}${a.genre?' · '+esc(a.genre.split(',')[0]):''}</div>
          <div class="list-tags">${a.tags.map(t=>`<span class="tag-mini" style="${tagMiniStyle(t)}">${esc(t)}</span>`).join('')}</div>
        </div>
        <div class="list-right">
          <div class="stars-sm">${starsHTML(a.rating,'star-sm')}</div>
          <span class="year-badge">${a.year}</span>
        </div>
      </div>`).join('');
  }

  const pg = document.getElementById('pagination');
  if (pages<=1) { pg.innerHTML=''; return; }
  let btns = `<button class="page-btn" onclick="goPage(${page-1})" ${page===1?'disabled':''}>←</button>`;
  for (let i=1;i<=pages;i++) {
    if(i===1||i===pages||Math.abs(i-page)<=1) btns+=`<button class="page-btn${i===page?' active':''}" onclick="goPage(${i})">${i}</button>`;
    else if(Math.abs(i-page)===2) btns+=`<span class="sep">…</span>`;
  }
  btns+=`<button class="page-btn" onclick="goPage(${page+1})" ${page===pages?'disabled':''}>→</button>`;
  pg.innerHTML=btns;
}

function goPage(p) { page=p; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ─── MODAL ────────────────────────────────────────────────────────────
let pendingCoverB64 = null;

function handleCoverUpload(e) {
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=ev=>{
    pendingCoverB64=ev.target.result;
    document.getElementById('cover-preview').innerHTML=`<img src="${pendingCoverB64}" style="width:100%;height:100%;object-fit:cover">`;
    document.getElementById('cover-clear-btn').style.display='inline-block';
  };
  r.readAsDataURL(f); e.target.value='';
}
function clearManualCover() {
  pendingCoverB64=null;
  if (editId) {
    const a=albums.find(x=>x.id===editId), src=getCover(a);
    document.getElementById('cover-preview').innerHTML = src?`<img src="${src}" style="width:100%;height:100%;object-fit:cover">`:(a.emoji||'🎵');
  } else { document.getElementById('cover-preview').innerHTML='🎵'; }
  document.getElementById('cover-clear-btn').style.display='none';
}
function setCoverPreview(src, emoji) {
  document.getElementById('cover-preview').innerHTML = src?`<img src="${src}" style="width:100%;height:100%;object-fit:cover">`:(emoji||'🎵');
  document.getElementById('cover-clear-btn').style.display = src?'inline-block':'none';
}

function buildStarSel(val) {
  starVal=val;
  document.getElementById('star-sel').innerHTML=Array.from({length:5},(_,i)=>`<div class="star-sel ${i<val?'on':'off'}" onclick="setStar(${i+1})"></div>`).join('');
}
function setStar(n) { starVal=n; buildStarSel(n); }

function buildTagsEdit(selected) {
  const d = isDark();
  const statusHTML = `<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px;padding-bottom:7px;border-bottom:1px solid var(--border)">` +
    STATUS_TAGS.map(t=>{
      const on=selected.includes(t), c=TAG_COLORS[t];
      const st=on?`background:${d?c.dbg:c.bg};color:${d?c.dtext:c.text};border-color:transparent;`:`border-color:${d?c.dtext:c.text};color:${d?c.dtext:c.text};`;
      return `<button class="tag-toggle${on?' on':''}" style="${st}" onclick="this.classList.toggle('on');syncTagStyle(this,'${t}')">${esc(t)}</button>`;
    }).join('')+'</div>';
  const restHTML = ALL_TAGS.filter(t=>!STATUS_TAGS.includes(t)).map(t=>{
    const on=selected.includes(t);
    return `<button class="tag-toggle${on?' on':''}" onclick="this.classList.toggle('on')">${esc(t)}</button>`;
  }).join('');
  document.getElementById('tags-edit').innerHTML = statusHTML+restHTML;
}
function syncTagStyle(btn, t) {
  const c=TAG_COLORS[t]; if(!c) return; const d=isDark();
  btn.style.cssText = btn.classList.contains('on')
    ? `background:${d?c.dbg:c.bg};color:${d?c.dtext:c.text};border-color:transparent;`
    : `border-color:${d?c.dtext:c.text};color:${d?c.dtext:c.text};`;
}
function getSelectedTags() { return [...document.querySelectorAll('.tag-toggle.on')].map(el=>el.textContent); }

function openAdd() {
  editId=null; pendingCoverB64=null;
  document.getElementById('modal-title').textContent='Nuevo álbum';
  document.getElementById('modal-subtitle').textContent='';
  document.getElementById('modal-art').innerHTML='🎵';
  document.getElementById('btn-del').style.display='none';
  ['f-title','f-artist','f-year','f-genre','f-notes'].forEach(id=>document.getElementById(id).value='');
  setCoverPreview(null,'🎵'); buildStarSel(0); buildTagsEdit([]);
  document.getElementById('modal').style.display='flex';
}
function openEdit(id) {
  const a=albums.find(x=>x.id===id); editId=id; pendingCoverB64=null;
  document.getElementById('modal-title').textContent=a.title;
  document.getElementById('modal-subtitle').textContent=a.artist+' · '+a.year;
  const src=a.manualCover||getCover(a);
  document.getElementById('modal-art').innerHTML=src?`<img src="${src}" alt="">`:(a.emoji||'🎵');
  setCoverPreview(src,a.emoji);
  document.getElementById('btn-del').style.display='inline-block';
  document.getElementById('f-title').value=a.title;
  document.getElementById('f-artist').value=a.artist;
  document.getElementById('f-year').value=a.year;
  document.getElementById('f-genre').value=a.genre||'';
  document.getElementById('f-notes').value=a.notes||'';
  buildStarSel(a.rating); buildTagsEdit(a.tags);
  document.getElementById('modal').style.display='flex';
}
function closeModal() { document.getElementById('modal').style.display='none'; }

function saveAlbum() {
  const d = {
    title:  document.getElementById('f-title').value||'Sin título',
    artist: document.getElementById('f-artist').value||'Desconocido',
    year:   parseInt(document.getElementById('f-year').value)||new Date().getFullYear(),
    genre:  document.getElementById('f-genre').value||'',
    rating: starVal,
    tags:   getSelectedTags(),
    notes:  document.getElementById('f-notes').value,
  };
  if (pendingCoverB64!==null) d.manualCover=pendingCoverB64;
  else if (editId) { const p=albums.find(a=>a.id===editId); if(p&&p.manualCover) d.manualCover=p.manualCover; }
  if (editId) { Object.assign(albums.find(a=>a.id===editId),d); }
  else { albums.push({id:nextId++,...d,emoji:getEmoji(d.genre)}); }
  saveAlbums(); closeModal(); render(); updateCacheInfo();
}
function deleteAlbum() {
  if (!confirm('¿Eliminar este álbum de tu biblioteca?')) return;
  albums=albums.filter(a=>a.id!==editId); saveAlbums(); closeModal();
  activeTags=activeTags.filter(t=>albums.some(a=>a.tags.includes(t)));
  render(); updateCacheInfo();
}

// ─── EXPORT / IMPORT ─────────────────────────────────────────────────
function exportData() {
  const blob=new Blob([JSON.stringify({albums,covers},null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='mi_biblioteca_albums.json'; a.click();
}
function importData(event) {
  const f=event.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=e=>{
    try {
      const data=JSON.parse(e.target.result);
      if(data.albums){albums=data.albums;saveAlbums();}
      if(data.covers){covers=data.covers;localStorage.setItem(COVERS_KEY,JSON.stringify(covers));}
      nextId=Math.max(0,...albums.map(a=>a.id))+1; activeTags=[]; page=1;
      render(); updateCacheInfo();
      alert(`Importados ${albums.length} álbumes correctamente.`);
    } catch(e){alert('Error al leer el archivo JSON.');}
  };
  r.readAsText(f); event.target.value='';
}

// ─── INIT ─────────────────────────────────────────────────────────────
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });
document.getElementById('search').addEventListener('input',()=>{page=1;render();});
document.getElementById('sort').addEventListener('change',()=>{page=1;render();});

render();
updateCacheInfo();
loadAllCovers();
</script>
</body>
</html>
